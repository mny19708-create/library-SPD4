<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Digital Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0d1117',
                        cardbg: '#161b22',
                        cardborder: '#30363d'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', 'Noto Sans Khmer', sans-serif; }
        button, input, select, textarea { font: inherit; }
        html[lang="km"] body,
        html[lang="km"] button,
        html[lang="km"] input,
        html[lang="km"] select,
        html[lang="km"] textarea { font-family: 'Noto Sans Khmer', 'Inter', sans-serif; }
        html.light-mode body { background: #f3f4f6; color: #111827; }
        html.light-mode main { background-color: #ffffff; border-color: #d1d5db; }
        html.light-mode .text-white { color: #111827; }
        html.light-mode .text-gray-300 { color: #374151; }
        html.light-mode .text-gray-400 { color: #6b7280; }
        html.light-mode [class~="bg-[#0d1117]"] { background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen bg-darkbg text-gray-100 flex items-center justify-center p-6">
    <main class="w-full max-w-md bg-cardbg border border-cardborder rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white">
                <i class="fa-solid fa-book-open text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Digital Library</h1>
                <p class="text-sm text-gray-400">Administrator Sign In</p>
            </div>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="username" class="block text-sm text-gray-300 mb-2">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required
                    class="w-full bg-[#0d1117] border border-cardborder rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label for="password" class="block text-sm text-gray-300 mb-2">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="w-full bg-[#0d1117] border border-cardborder rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <p id="login-error" class="hidden text-sm text-rose-400" role="alert"></p>
            <button id="login-submit" type="submit"
                class="w-full px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition">
                Sign In
            </button>
        </form>
    </main>

    <script src="/preferences.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('login-error');
        const submitButton = document.getElementById('login-submit');

        fetch('/api/auth/session', { credentials: 'same-origin' })
            .then(response => {
                if (response.ok) window.location.replace('/dasboard.html');
            })
            .catch(error => console.error('Session check error:', error));

        form.addEventListener('submit', async event => {
            event.preventDefault();
            errorMessage.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = 'Signing In...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: form.elements.username.value,
                        password: form.elements.password.value
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Sign in failed.');
                window.location.replace('/dasboard.html');
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>

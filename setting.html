<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Digital Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0d1117',
                        cardbg: '#161b22',
                        cardborder: '#30363d',
                        accent: '#6366f1',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', 'Noto Sans Khmer', sans-serif; }
        button, input, select, textarea { font: inherit; }
        html[lang="km"] body,
        html[lang="km"] button,
        html[lang="km"] input,
        html[lang="km"] select,
        html[lang="km"] textarea { font-family: 'Noto Sans Khmer', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
        html.light-mode body { background: #f3f4f6; color: #111827; }
        html.light-mode .bg-darkbg,
        html.light-mode .bg-cardbg,
        html.light-mode aside { background-color: #ffffff; }
        html.light-mode .bg-darkbg\/80 { background-color: rgba(255, 255, 255, 0.9); }
        html.light-mode [class~="bg-[#11161d]"],
        html.light-mode [class~="bg-[#161b22]"] { background-color: #f8fafc; }
        html.light-mode [class~="bg-[#1f242d]"] { background-color: #e5e7eb; }
        html.light-mode .text-white { color: #111827; }
        html.light-mode .text-gray-100,
        html.light-mode .text-gray-200,
        html.light-mode .text-gray-300 { color: #374151; }
        html.light-mode .text-gray-400,
        html.light-mode .text-gray-500 { color: #6b7280; }
        html.light-mode .border-cardborder { border-color: #d1d5db; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 h-screen flex overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Sidebar Navigation -->
    <aside class="w-72 bg-[#11161d] border-r border-[#21262d] flex flex-col justify-between shrink-0 transition-all duration-300 z-20">
        <div>
            <!-- Brand Logo -->
            <div class="p-6 flex items-center space-x-3 border-b border-[#21262d]">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg tracking-wide text-white">Digital Library</h2>
                    <p class="text-xs text-gray-400">Administration System</p>
                </div>
            </div>

            <!-- Menu Items -->
            <nav class="p-4 space-y-2">
                <a href="/dasboard.html" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl font-medium transition-all duration-200 text-gray-400 hover:bg-[#21262d] hover:text-white">
                    <i class="fa-solid fa-house-chimney w-5 text-center"></i>
                    <span>Home</span>
                </a>
                <a href="/dasboard.html" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl font-medium transition-all duration-200 text-gray-400 hover:bg-[#21262d] hover:text-white">
                    <i class="fa-solid fa-book-bookmark w-5 text-center"></i>
                    <span>Book Borrowing</span>
                </a>
                <a href="/rooms.html" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl font-medium transition-all duration-200 text-gray-400 hover:bg-[#21262d] hover:text-white">
                    <i class="fa-solid fa-door-open w-5 text-center"></i>
                    <span>Study Room Booking</span>
                </a>
                <a href="/dasboard.html" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl font-medium transition-all duration-200 text-gray-400 hover:bg-[#21262d] hover:text-white">
                    <i class="fa-solid fa-shield-halved w-5 text-center"></i>
                    <span>System Audit</span>
                </a>
                <!-- Active Item: Settings -->
                <a href="/setting.html" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl font-medium transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-gear w-5 text-center"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-[#21262d] space-y-3">
            <div class="flex items-center space-x-3 p-2 bg-[#161b22] rounded-xl border border-[#30363d]">
                <div class="w-9 h-9 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-sm">
                    AD
                </div>
                <div class="overflow-hidden">
                    <p id="sidebar-admin-name" class="text-sm font-semibold truncate text-white">roth</p>
                    <p class="text-xs text-emerald-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active
                    </p>
                </div>
            </div>
            <button onclick="handleLogout()" class="w-full flex items-center space-x-2 px-3 py-2 text-xs font-semibold text-rose-400 hover:bg-rose-500/10 rounded-xl transition">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-darkbg">
        <!-- Top Header Bar -->
        <header class="h-20 bg-darkbg/80 border-b border-[#21262d] px-8 flex justify-between items-center shrink-0 backdrop-blur-md">
            <div class="text-xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-gear text-indigo-400"></i> Settings & Security
            </div>
        </header>

        <!-- Setting Forms Area -->
        <div class="flex-1 overflow-y-auto p-8 relative space-y-6 max-w-4xl">

            <!-- Card 1: Admin Profile -->
            <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-lg space-y-4">
                <h3 class="text-base font-bold text-white">Administrator Profile</h3>
                <form onsubmit="handleProfileUpdate(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Display Name</label>
                        <input type="text" id="display-name" required class="w-full bg-[#11161d] border border-cardborder rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition">
                        Save Profile
                    </button>
                </form>
            </div>

            <!-- Card 2: Security & Change Password -->
            <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-lg space-y-4">
                <h3 class="text-base font-bold text-white">Security & Password</h3>
                <form onsubmit="handlePasswordUpdate(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Current Password</label>
                        <input type="password" id="current-password" required placeholder="Enter current password" class="w-full bg-[#11161d] border border-cardborder rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">New Password</label>
                        <input type="password" id="new-password" required minlength="12" placeholder="At least 12 characters" class="w-full bg-[#11161d] border border-cardborder rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Confirm New Password</label>
                        <input type="password" id="confirm-password" required minlength="12" placeholder="Confirm your new password" class="w-full bg-[#11161d] border border-cardborder rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition">
                        Update Password
                    </button>
                </form>
            </div>

            <!-- Card 3: Preferences -->
            <div class="bg-cardbg border border-cardborder p-6 rounded-2xl shadow-lg space-y-4">
                <h3 class="text-base font-bold text-white">Preferences</h3>
                
                <div class="flex justify-between items-center py-2 border-b border-cardborder">
                    <div>
                        <p class="text-sm font-semibold text-white">Appearance</p>
                        <p class="text-xs text-gray-400">Choose the admin panel theme.</p>
                    </div>
                    <select id="theme-select" class="bg-[#11161d] border border-cardborder text-white text-xs px-3 py-2 rounded-xl focus:outline-none">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>

                <div class="flex justify-between items-center py-2">
                    <div>
                        <p class="text-sm font-semibold text-white">Language</p>
                        <p class="text-xs text-gray-400">Choose the interface language.</p>
                    </div>
                    <select id="language-select" class="bg-[#11161d] border border-cardborder text-white text-xs px-3 py-2 rounded-xl focus:outline-none">
                        <option value="en">English</option>
                        <option value="km">Khmer (ភាសាខ្មែរ)</option>
                    </select>
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-[#1f242d] border border-cardborder text-white px-5 py-3 rounded-xl shadow-2xl z-50 transform translate-y-24 opacity-0 transition-all duration-300 flex items-center gap-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg" class="text-sm font-medium">Success!</span>
    </div>

    <script src="/preferences.js"></script>
    <script>
        // Check the admin session and load profile details.
        async function loadProfile() {
            try {
                const res = await fetch('/api/auth/session', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                document.getElementById('display-name').value = data.displayName || data.username;
                document.getElementById('sidebar-admin-name').innerText = data.displayName || data.username;
            } catch (err) {
                console.error('Session load error:', err);
                window.location.href = '/login.html';
            }
        }

        // Update the admin display name.
        async function handleProfileUpdate(e) {
            e.preventDefault();
            const displayName = document.getElementById('display-name').value.trim();
            try {
                const res = await fetch('/api/admin/profile', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ displayName })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed to update profile');

                document.getElementById('sidebar-admin-name').innerText = result.displayName;
                showToast('Display name updated successfully.');
            } catch (err) {
                showToast(err.message, true);
            }
        }

        // Update the admin password.
        async function handlePasswordUpdate(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showToast('New password and confirmation do not match!', true);
                return;
            }

            try {
                const res = await fetch('/api/admin/password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed to update password');

                document.getElementById('current-password').value = '';
                document.getElementById('new-password').value = '';
                document.getElementById('confirm-password').value = '';
                showToast('Password updated successfully.');
            } catch (err) {
                showToast(err.message, true);
            }
        }

        // Sign out of the admin account.
        async function handleLogout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            } finally {
                window.location.href = '/login.html';
            }
        }

        // Toast Helper
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            if (isError) {
                icon.className = 'fa-solid fa-circle-xmark text-rose-400';
            } else {
                icon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
